version: 2
# Weekly pull requests into main that keep dependencies and the pinned workflow actions current.
# CI verifies each one; merging is yours.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /selfhost
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /selfhost/service
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
