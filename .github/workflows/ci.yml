name: CI

# One run per commit: it verifies, and on develop and main it publishes what the commit changed.
# Pull requests into develop and main must pass the `Verify` job (both rulesets require it), and
# one into main must come from develop. develop publishes for testing (the `dev` image, launcher
# prereleases `-dev.<n>`); main publishes for the players (`latest`, the campaigns service, the
# compendium sources, launcher releases).
# See .github/WORKFLOW.md for the whole process and the secrets each step needs.
#
# `plan` decides what runs. A pull request runs only the checks its files concern (a change of this
# workflow or its actions runs them all). A push runs no check when a pull request already verified
# the very tree it pushes (`verified-tree-<tree>` artifact), so it goes straight to publication. The
# image is built while the checks run and is only tagged for players once `Verify` passed.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  # A workflow started by another workflow's token (a pull request it opened) runs CI this way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'check' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  IMAGE: kunail0804/atlas-relay
  # The test suite has assertions that read numbers the English way.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  plan:
    name: What to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.plan.outputs.tree }}
      plugin: ${{ steps.plan.outputs.plugin }}
      relay: ${{ steps.plan.outputs.relay }}
      launcher: ${{ steps.plan.outputs.launcher }}
      service: ${{ steps.plan.outputs.service }}
      image: ${{ steps.plan.outputs.image }}
      launcher-release: ${{ steps.plan.outputs.launcher-release }}
      service-deploy: ${{ steps.plan.outputs.service-deploy }}
      compendium: ${{ steps.plan.outputs.compendium }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its base, to list the files it changes.
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          case "$EVENT" in
            pull_request) files=$(git diff --name-only HEAD^1 HEAD) ;;
            push)
              if git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                files=$(git diff --name-only "$BEFORE" HEAD)
              else
                files=$(git ls-files)
              fi ;;
            *) files=$(git ls-files) ;;
          esac
          printf '%s\n' "$files"
          any() { printf '%s\n' "$files" | grep -Eq "$1"; }
          other() { printf '%s\n' "$files" | grep -Evq "$1"; }
          out() { if "$@"; then echo true; else echo false; fi; }

          # Publication, for a push: what the commit changed.
          # The image holds the plugin, the relay and the player page; a change of the pipeline that builds
          # and publishes it publishes it again.
          outside='^(\.github/|docs/|tests/|selfhost/tests/|selfhost/launcher/|selfhost/service/|compendium/)|\.md$'
          pipeline='^\.github/(workflows|actions)/'
          if any "$pipeline" || other "$outside"; then echo image=true; else echo image=false; fi >> "$GITHUB_OUTPUT"
          {
            echo "launcher-release=$(out any '^selfhost/launcher/')"
            echo "service-deploy=$(out any '^selfhost/service/')"
            echo "compendium=$(out any '^compendium/builder/')"
          } >> "$GITHUB_OUTPUT"

          # Checks. A push whose tree a pull request verified runs none; otherwise each runs where its files changed.
          verified=false
          if [ "$EVENT" = push ]; then
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=verified-tree-$tree" \
              --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID)] | length")
            if [ "$count" -gt 0 ]; then verified=true; echo "A pull request verified tree $tree: no check runs again." >> "$GITHUB_STEP_SUMMARY"; fi
          fi
          if [ "$verified" = true ]; then
            for job in plugin relay launcher service; do echo "$job=false"; done >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != pull_request ] || any "$pipeline|^\.nvmrc$"; then
            for job in plugin relay launcher service; do echo "$job=true"; done >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "plugin=$(out other '^(selfhost/launcher/|selfhost/service/|docs/|\.github/)|\.md$')"
            echo "relay=$(out other '^(selfhost/launcher/|selfhost/service/|docs/|compendium/|tests/|\.github/)|\.md$')"
            echo "launcher=$(out any '^selfhost/launcher/')"
            echo "service=$(out any '^selfhost/service/')"
          } >> "$GITHUB_OUTPUT"

  typecheck:
    name: Plugin typecheck
    needs: plan
    if: needs.plan.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
      - run: ./node_modules/.bin/tsc --noEmit

  lint:
    name: Plugin lint
    needs: plan
    if: needs.plan.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
      - run: npm run lint

  unit:
    name: Plugin unit tests
    needs: plan
    if: needs.plan.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
      - run: ./node_modules/.bin/vitest run --project unit

  build:
    name: Plugin build
    needs: plan
    if: needs.plan.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
      - name: Code shared with the player page
        run: npm run check:boundaries
      - name: Build
        run: npm run build:ci

  relay:
    name: Relay and player page
    needs: plan
    if: needs.plan.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
        with:
          projects: . selfhost
          chromium: 'true'
      - name: Typecheck
        run: npm run typecheck --prefix selfhost
      # The relay serves the built page; its security tests read the page's headers, and the browser tests drive it.
      - name: Build the player page
        run: npm run player:build --prefix selfhost
      - name: Relay tests
        run: ./node_modules/.bin/vitest run --config selfhost/vitest.config.mts --exclude 'selfhost/tests/**/*.browser.test.ts'
      - name: Browser tests
        run: ./node_modules/.bin/vitest run --config selfhost/vitest.config.mts .browser.test

  launcher:
    name: Launcher
    needs: plan
    if: needs.plan.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: selfhost/launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno test -A

  service:
    name: Campaigns service
    needs: plan
    if: needs.plan.outputs.service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
        with:
          projects: selfhost/service
      - run: npm run typecheck
        working-directory: selfhost/service
      - name: Bundle without deploying
        working-directory: selfhost/service
        run: ./node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
        env:
          WRANGLER_SEND_METRICS: 'false'

  # main takes only what was tested on develop.
  source:
    name: Into main only from develop
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request' && github.base_ref == 'main' && (github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository)
        env:
          HEAD: ${{ github.event.pull_request.head.label }}
        run: |
          echo "::error::A pull request into main comes from develop, not from $HEAD. Open it into develop (see .github/WORKFLOW.md)."
          exit 1
      - run: echo "Source branch accepted"

  # A check that `plan` left out is skipped, and that is a pass; one that failed or was cancelled is not.
  verify:
    name: Verify
    if: always()
    needs: [plan, source, typecheck, lint, unit, build, relay, launcher, service]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        if: needs.plan.result != 'success' || needs.source.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A check did not pass"
          exit 1
      - run: echo "Every check passed"
      # A pull request whose checks all ran and passed names its tree, so the push that merges it runs none again.
      - id: mark
        if: >-
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
          needs.typecheck.result == 'success' && needs.lint.result == 'success' && needs.unit.result == 'success' &&
          needs.build.result == 'success' && needs.relay.result == 'success' && needs.launcher.result == 'success' &&
          needs.service.result == 'success'
        env:
          TREE: ${{ needs.plan.outputs.tree }}
        run: |
          echo "$TREE" > "$RUNNER_TEMP/verified-tree"
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - if: steps.mark.outputs.verified == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-tree-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/verified-tree
          retention-days: 14

  # ---- Publication: only for a push to develop or main whose checks all passed ----
  # A job is skipped when a job it needs, even indirectly, was skipped, unless its `if` names a status:
  # the checks `plan` leaves out are skipped, so each publication job asks `!cancelled()` and Verify's result.

  # Built while the checks run, pushed only as sha-<commit>; `image` names it for players once Verify passed.
  image-build:
    name: Build the image
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_TOKEN" || { echo "::error::The secret DOCKERHUB_TOKEN is not set (see .github/WORKFLOW.md)"; exit 1; }
      # main publishes <version>-selfhost.<n> and latest, develop <version>-dev.<n> and dev.
      - name: Next version
        id: version
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then kind=selfhost; channel=latest; else kind=dev; channel=dev; fi
          base=$(node -p "require('./package.json').version")
          curl -fsS -o "$RUNNER_TEMP/tags.json" "https://hub.docker.com/v2/repositories/$IMAGE/tags?page_size=100&name=$base-$kind."
          last=$(jq -r --arg prefix "$base-$kind." '[.results[].name | select(startswith($prefix)) | ltrimstr($prefix) | select(test("^[0-9]+$")) | tonumber] | max // 0' "$RUNNER_TEMP/tags.json")
          echo "tag=$base-$kind.$((last + 1))" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: kunail0804
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: selfhost/Dockerfile
          push: true
          # A dev build names itself in the GM's map view; main's builds stay unmarked.
          build-args: |
            ATLAS_DEV_BUILD=${{ steps.version.outputs.channel == 'dev' && steps.version.outputs.tag || '' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: Publish the image
    needs: [verify, image-build]
    if: "!cancelled() && github.event_name == 'push' && needs.verify.result == 'success' && needs.image-build.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-image
      cancel-in-progress: false
    env:
      TAG: ${{ needs.image-build.outputs.tag }}
      CHANNEL: ${{ needs.image-build.outputs.channel }}
    steps:
      # Two pushes built at once may have taken the same number: the later one stops here rather than overwrite it.
      - name: The version is still free
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/$IMAGE/tags/$TAG")
          test "$status" = 404 || { echo "::error::$IMAGE:$TAG exists already (HTTP $status): push again to publish this commit"; exit 1; }
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: kunail0804
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag the image
        run: docker buildx imagetools create --tag "$IMAGE:$TAG" --tag "$IMAGE:$CHANNEL" "$IMAGE:sha-$GITHUB_SHA"
      - name: Tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/relay-$TAG" -f sha="$GITHUB_SHA" > /dev/null
          echo "Published \`$IMAGE:$TAG\` and \`$CHANNEL\` from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  launcher-release:
    name: Release the launcher
    needs: [plan, verify]
    if: "!cancelled() && github.event_name == 'push' && needs.verify.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-launcher
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # On main a release is made once per version: raising VERSION in selfhost/launcher/version.ts
      # releases it. On develop every push that changes the launcher makes launcher-v<VERSION>-dev.<n>,
      # which installed launchers never offer as an update (update.ts reads only x.y.z).
      - name: Version
        id: version
        env:
          CHANGED: ${{ needs.plan.outputs.launcher-release }}
        run: |
          version=$(sed -n "s/^export const VERSION = '\(.*\)';$/\1/p" selfhost/launcher/version.ts)
          test -n "$version"
          if [ "$GITHUB_REF_NAME" = main ]; then
            tag="launcher-v$version"
            if gh release view "$tag" > /dev/null 2>&1; then new=false; else new=true; fi
            previous=$(git tag --list 'launcher-v*' --sort=-creatordate | grep -v -- '-dev\.' | head -1 || true)
          else
            last=$(git tag --list "launcher-v$version-dev.*" | sed "s/^launcher-v$version-dev\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
            tag="launcher-v$version-dev.$(( ${last:-0} + 1 ))"
            new=$CHANGED
            previous=$(git tag --list 'launcher-v*' --sort=-creatordate | head -1 || true)
          fi
          { echo "tag=$tag"; echo "new=$new"; echo "previous=$previous"; } >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.new == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: steps.version.outputs.new == 'true'
        name: Build
        working-directory: selfhost/launcher
        run: deno task build && (cd dist && sha256sum atlas atlas.exe > SHA256SUMS)
      - if: steps.version.outputs.new == 'true'
        name: Release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          previous: ${{ steps.version.outputs.previous }}
        run: |
          {
            echo "The \`atlas\` launcher for the self-hosted Atlas VTT fork."
            echo
            echo "- **Windows:** download \`atlas.exe\` and double-click it."
            echo "- **Linux:** download \`atlas\`, run \`chmod +x atlas\`, then \`./atlas\`."
            echo
            echo "You need Docker (Docker Desktop on Windows) and Obsidian. \`atlas man\` lists every command. \`SHA256SUMS\` holds the fingerprints of both files."
            echo
            if [ "$GITHUB_REF_NAME" != main ]; then
              echo "**Development build from \`develop\`**, for testing: \`atlas start <name> --dev\` runs the \`dev\` image."
              echo
            fi
            echo "Changes since ${previous:-the first release}:"
            git log --format='- %s (%h)' ${previous:+$previous..}HEAD -- selfhost/launcher
            echo
            echo "Built by CI from $GITHUB_SHA."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" selfhost/launcher/dist/atlas selfhost/launcher/dist/atlas.exe selfhost/launcher/dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Atlas launcher ${TAG#launcher-v}" --prerelease --notes-file "$RUNNER_TEMP/notes.md"

  service-deploy:
    name: Deploy the campaigns service
    needs: [plan, verify]
    # The players' service: deployed from main only.
    if: "!cancelled() && github.event_name == 'push' && github.ref_name == 'main' && needs.verify.result == 'success' && needs.plan.outputs.service-deploy == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-service
      cancel-in-progress: false
    defaults:
      run:
        working-directory: selfhost/service
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: selfhost/service/package-lock.json
      - name: Secrets
        run: test -n "$CLOUDFLARE_API_TOKEN" -a -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::The secrets CLOUDFLARE_DEPLOY_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set (see .github/WORKFLOW.md)"; exit 1; }
      - run: npm ci --ignore-scripts
      # The Worker's own secrets (Discord, the tunnels token) stay as selfhost/service/setup.sh set them.
      - name: Apply the database migrations
        run: ./node_modules/.bin/wrangler d1 migrations apply atlas-campaigns --remote
      - name: Deploy the Worker
        run: ./node_modules/.bin/wrangler deploy
      - run: echo "Deployed https://campaigns.kunlab.cc from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  compendium-release:
    name: Release the compendium sources
    needs: [plan, verify]
    if: "!cancelled() && github.event_name == 'push' && github.ref_name == 'main' && needs.verify.result == 'success' && needs.plan.outputs.compendium == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: publish-compendium
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the sources
        run: |
          git clone --depth 1 https://github.com/5e-bits/5e-database.git "$RUNNER_TEMP/5e-database"
          echo "5e-database at $(git -C "$RUNNER_TEMP/5e-database" rev-parse HEAD)"
          npm run compendium:build -- --database "$RUNNER_TEMP/5e-database" --out "$RUNNER_TEMP/compendium"
      - name: Compare with what Atlas downloads
        id: compare
        run: |
          if node scripts/compendium-sources.mjs check "$RUNNER_TEMP/compendium/catalog.json"; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"
      - name: Release and open the pull request that points Atlas at it
        if: steps.compare.outputs.changed == 'true'
        run: |
          last=$(git tag --list 'compendium-v*' | sed 's/compendium-v//' | sort -n | tail -1)
          tag="compendium-v$(( ${last:-0} + 1 ))"
          gh release create "$tag" "$RUNNER_TEMP"/compendium/*.zip "$RUNNER_TEMP/compendium/catalog.json" \
            --target "$GITHUB_SHA" --prerelease --title "Compendium sources ${tag#compendium-}" \
            --notes "Built by CI from $GITHUB_SHA. Atlas downloads these once the pull request that names them is merged."
          node scripts/compendium-sources.mjs write "$RUNNER_TEMP/compendium/catalog.json" "$tag"
          branch="compendium/$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "compendium: download the sources of $tag"
          git push origin "$branch"
          gh pr create --base develop --head "$branch" --title "compendium: download the sources of $tag" \
            --body "The compendium builder changed on main, so CI built the sources again and released them as \`$tag\`. This points \`officialSources.ts\` at them."
          # A pull request opened with the workflow's own token starts no workflow: CI is started by hand on the branch.
          gh workflow run ci.yml --ref "$branch"
