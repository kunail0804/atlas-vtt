name: Agent

# Claude Code works on an issue or a pull request when you ask it: the label `agent` on an issue, or
# `@claude` in an issue, a comment or a review. It works on a branch `agent/...` and opens a pull
# request into main, which CI verifies like any other. Only accounts with write access start it.
# It runs on your Claude subscription (CLAUDE_CODE_OAUTH_TOKEN, made with `claude setup-token`).

on:
  issues:
    types: [opened, labeled, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  agent:
    name: Claude Code
    # Starts a runner only where the agent was asked for.
    if: >-
      (github.event_name == 'issues' && (github.event.label.name == 'agent' || contains(github.event.issue.body, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Secrets
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: test -n "$CLAUDE_CODE_OAUTH_TOKEN" || { echo "::error::The secret CLAUDE_CODE_OAUTH_TOKEN is not set (see .github/WORKFLOW.md)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm ci --prefix selfhost
      - uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A pull request opened with the workflow's own token would start no CI: a personal token
          # (AUTOMATION_TOKEN) or the Claude GitHub App opens it instead.
          github_token: ${{ secrets.AUTOMATION_TOKEN }}
          label_trigger: agent
          trigger_phrase: '@claude'
          branch_prefix: agent/
          track_progress: true
          claude_args: |
            --model opus
            --allowedTools "Bash(npm ci:*),Bash(npm run:*),Bash(npx tsc:*),Bash(npx vitest:*),Bash(npx eslint:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"
            --append-system-prompt "Follow the 'Fork workflow' section at the top of CLAUDE.md and .github/WORKFLOW.md. Open a pull request into main whose description says 'Closes #<issue>' and how you verified the change."
