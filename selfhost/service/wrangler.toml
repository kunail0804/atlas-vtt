# The accounts and campaigns service. Personal values (account, zone, Discord ids and secrets) are
# Worker secrets, set by selfhost/service/setup.sh from ~/.config/atlas-vtt-admin/secrets.env.
name = "atlas-campaigns"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "campaigns.kunlab.cc", custom_domain = true }]

[vars]
PUBLIC_ORIGIN = "https://campaigns.kunlab.cc"
CAMPAIGN_DOMAIN = "kunlab.cc"

[[d1_databases]]
binding = "DB"
database_name = "atlas-campaigns"
database_id = "a5a33617-106c-4f13-a25c-36758ca01968"
migrations_dir = "migrations"

# Login routes: 10 calls a minute per visitor address, per Cloudflare location.
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "7301"

  [ratelimits.simple]
  limit = 10
  period = 60
